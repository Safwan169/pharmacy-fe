name: Deploy Frontend to Home Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, pharmacy-frontend-home]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check (Lint)
        run: |
          npm run lint

      - name: Deploy to Server Folder
        run: |
          mkdir -p /root/pharmacy/pharmacy-next-frontend
          cp -rT . /root/pharmacy/pharmacy-next-frontend/

      - name: Start Application
        working-directory: /root/pharmacy/pharmacy-next-frontend
        run: |
          # Make env file
          if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          echo "PORT=3012" >> .env
          echo "NEXT_PUBLIC_API_URL=http://192.168.0.150:3011" >> .env
          
          # Build and start
          docker compose down || true
          docker compose up -d --build
